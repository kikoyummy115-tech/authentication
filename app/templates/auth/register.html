<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% block title %}
    <title>Register</title>
    {% endblock %}
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    {% with messages = get_flashed_messages(with_categories=true) %}
    <div id="toast-container">
      {% for category, message in messages %}
      <div class="fixed toast-card alert alert-{{ category }}">
        {{ message }}
      </div>
      {% endfor %}
    </div>
    {% endwith %}

    <div class="flex h-screen items-center justify-center">
      <form
        action="{{url_for('auth.register')}}"
        method="POST"
        class="fieldset bg-base-200 border-base-300 rounded-box w-xs border p-4"
      >
        <h1 class="text-lg font-semibold">Register New Account</h1>
        <label class="label">Username</label>
        <input
          type="text"
          class="input"
          placeholder="Username"
          name="username"
        />

        <label class="label">Email</label>
        <input type="email" class="input" placeholder="Email" name="email" />

        <label class="label">Password</label>
        <input
          type="password"
          class="input"
          placeholder="Password"
          name="password"
        />

        <button class="btn btn-primary mt-4" type="submit">Register</button>

        <a
          class="flex justify-center font-semibold text-slate-600"
          href="{{ url_for('auth.login')}}"
          >Already have an account? Login here</a
        >
      </form>
    </div>
  </body>
  <script src="{{ url_for('static', filename='js/toastMessage.js') }}"></script>
</html>
