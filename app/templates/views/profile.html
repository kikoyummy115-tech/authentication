{% extends 'base.html' %}{% block title %}
<title>{{ current_user.username }} - Profile</title>{% endblock %} {% block
content %}

<div class="flex w-full flex-col gap-4 p-4">
  <div class="flex flex-col gap-4">
    <div class="flex items-center gap-4">
      <div>
        <h1 class="text-xl font-semibold">Your photo</h1>

        <img
          src="{% if  current_user.img_url == 'default.jpg'%}
                {{ url_for('static', filename='image/profile.png' ) }}
              {% else %}
                {{ current_user.img_url}}
              {% endif %}"
          class="h-40 w-40 shrink-0 rounded-full"
          alt="profile"
        />
        <legend class="text-xs p-1">
          Change Photo <label class="label text-xs">Max size 2MB</label>
        </legend>
        <div class="flex flex-col gap-4 md:flex-row">
          <form>
            <input type="file" class="file-input file-input-sm" />
          </form>

          <form>
            <button class="btn bg-red-500 text-white btn-sm">Remove</button>
          </form>
        </div>
      </div>
    </div>
    <div class="w-full">
      <form class="flex p-2 gap-2">
        <button class="btn btn-sm">
          <span class="material-symbols-outlined"> edit </span>
        </button>
      </form>
      <hr />
      <fieldset class="fieldset p-4">
        <p class="">Username</p>
        <p class="text-sm border-1 p-2 w-100 rounded-sm">
          {{ current_user.username }}
        </p>
        <p class="">Email</p>
        <p class="text-sm border-1 p-2 w-100 rounded-sm">
          {{ current_user.email }}
        </p>
        <p class="">Role</p>
        <p class="text-sm border-1 p-2 w-100 rounded-sm">
          {{ current_user.role.name }}
        </p>
      </fieldset>
      <hr />
    </div>
  </div>
</div>
{% endblock %}
